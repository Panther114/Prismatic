providers = ["node"]

[variables]
NIXPACKS_SPA_CADDY = "false"
PRISMATIC_CLOUD = "1"
NODE_ENV = "production"

[phases.setup]
nixPkgs = ["nodejs_22", "pnpm"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = [
  "pnpm build:server",
  "rm -rf node_modules dist",
]

[start]
cmd = "NODE_ENV=production PRISMATIC_CLOUD=1 node --max-old-space-size=128 dist-server/cloud.mjs"
