# Prismatic — optional health-only Railway service (no website, no share).
# Playlist transfer is local zip export/import in the desktop app.

[build]
builder = "NIXPACKS"
buildCommand = "pnpm build:server"

[deploy]
startCommand = "NODE_ENV=production PRISMATIC_CLOUD=1 node --max-old-space-size=128 dist-server/cloud.mjs"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1
