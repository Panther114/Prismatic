[package]
name = "prismatic"
version = "2.1.1"
description = "A lightweight cinematic music player and visual exporter"
authors = ["Prismatic"]
edition = "2021"

# Windows PE version resource fields (taskbar / Explorer identity)
[package.metadata.tauri-winres]
OriginalFilename = "Prismatic.exe"
InternalName = "Prismatic"
ProductName = "Prismatic"
FileDescription = "Prismatic"
LegalCopyright = "Prismatic"
CompanyName = "Prismatic"

[lib]
name = "prismatic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
walkdir = "2"
dirs = "6"
lofty = "0.22"
time = { version = "0.3", features = ["formatting"] }
symphonia = { version = "0.5", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
notify = "8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
